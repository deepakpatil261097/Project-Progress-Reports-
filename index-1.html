<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Daily progress report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

</style></head><body><div class="w">
<div id="pj"></div><nav><button data-v="plan">Plan</button><button data-v="close">Close day</button><button data-v="hist">History</button><button data-v="week">Weekly</button></nav>
<div class="msg" id="msg" role="status"></div><div id="v"></div>
<input type="file" id="fi" accept="image/*" multiple hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="im" accept=".json,application/json" multiple hidden></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

const avg=a=>a.length?Math.round(a.reduce((x,t)=>x+t.p,0)/a.length):0,due=t=>fmt(add(t.s,t.a-1)),nm=u=>u===me.id?(me.name||'You'):(NAMES[u]||'Teammate');

async function init(){
 assets=1;
 me={id:LS('uid')||'u'+Math.random().toString(36).slice(2,10),name:LS('uname')||''};LW('uid',me.id);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 let s=null;if(db){try{const r=await db.doc('state/'+me.id).get();s=r.exists?r.data():null}catch(e){}}else s=LS('st');

 if(S.pd!==today){S.pts=[];S.pd=today}
 S.pr=S.pr||{};if(!S.cur&&S.project&&S.project.code)S.cur=S.project.code;PE=!S.cur||!S.team||!me.name;
 if(db){try{db.collection('days').onSnapshot(q=>{DAYS=q.docs.map(d=>d.data());names();if(cur==='hist'||cur==='week')render()},()=>{})}catch(e){}}else DAYS=LS('days')||[];DAYS.forEach(d=>{if(d.name)NAMES[d.uid]=d.name});
 if(db){try{db.collection('projects').onSnapshot(q=>{PROJ=q.docs.map(d=>d.data());fixCur();if(cur!=='close'&&!($('pc')&&($('pc').value||$('pn2').value)))render()},()=>{})}catch(e){}}else PROJ=LS('projs')||[];
 if(S.project&&S.project.code&&!S.mg){S.mg=1;putProj(S.project).catch(()=>{});save()}

const NOP='<div class="cd em">Select or create a project above to start.</div>',isNew=()=>NP||(!S.cur&&!PROJ.length),curP=()=>PROJ.find(x=>x.code===S.cur)||{code:S.cur,name:'',client:''};
async function delProj(c){PROJ=PROJ.filter(x=>x.code!==c);if(db)await db.doc('projects/'+c.replace(/[^A-Za-z0-9_-]/g,'_')).delete();else LW('projs',PROJ)}
function fixCur(){if(!S)return;let ch=0;PROJ.forEach(m=>(m.prev||[]).forEach(o=>{if(o===m.code||PROJ.some(x=>x.code===o))return;if(S.pr&&S.pr[o]){S.pr[m.code]=S.pr[o];delete S.pr[o];ch=1}if(S.cur===o){S.cur=m.code;ch=1}}));if(ch)save()}
async function putProj(p){PROJ=PROJ.filter(x=>x.code!==p.code).concat([p]);if(db)await db.doc('projects/'+p.code.replace(/[^A-Za-z0-9_-]/g,'_')).set(p);else LW('projs',PROJ)}
function switchTo(c){if(c===S.cur)return;if(S.cur)S.pr[S.cur]={tasks:S.tasks,pts:S.pts,pd:S.pd,iss:S.iss};const n=S.pr[c]||{tasks:[],pts:[],pd:today,iss:[]};S.tasks=n.tasks;S.pts=n.pd===today?n.pts:[];S.pd=today;S.iss=n.iss;S.cur=c}
function vPlan(){if(!S.cur)return NOP;
 const pend=S.tasks.filter(t=>t.p<100&&t.sc!==today).sort((a,b)=>st(a,today).k-st(b,today).k),td=S.tasks.filter(t=>t.sc===today),late=pend.filter(t=>st(t,today).k===0).length;let h='';
 if(S.iss.length)h+=`<div class="cd"><h3>Open points from earlier</h3>`+S.iss.map((x,i)=>`<div class="it"><div><span class="pl ab">${esc(x.c)}</span> <span class="mu">${fmt(x.d)}</span><div>${esc(x.t)}</div></div><button class="sm" data-a="res" data-i="${i}">Resolve</button></div>`).join('')+`</div>`;
 h+=`<div class="cd"><div class="hr"><h3>Pending tasks (${pend.length})${late?' · '+late+' delayed':''}</h3>${pend.length?'<button class="sm" data-a="all">Add all</button>':''}</div>`+(pend.length?pend.map(t=>{const s=st(t,today);return `<div class="it${s.k?'':' late'}"><div><div>${esc(t.n)}</div><div class="mu">${t.p}% done · Day ${s.day} of ${t.a} · Due ${due(t)}</div></div><div class="rt"><span class="pl ${s.c}">${s.l}</span><button class="sm" data-a="add" data-id="${t.id}">Add</button></div></div>`}).join(''):'<div class="em">No pending tasks.</div>')+'</div>';
 h+=`<div class="cd"><h3>Today's schedule (${td.length})</h3>`+(td.length?td.map(t=>`<div class="it"><div><div>${esc(t.n)}</div><div class="mu">${t.p?t.p+'% done':'New'} · Due ${due(t)}</div></div><div class="rt"><button class="sm" data-a="d" data-d="-1" data-id="${t.id}">-</button><span>${t.a} d</span><button class="sm" data-a="d" data-d="1" data-id="${t.id}">+</button><button class="sm" data-a="rm" data-id="${t.id}" aria-label="Remove">x</button></div></div>`).join(''):'<div class="em">Tap Add on a pending task, or add a new one below.</div>')+`<div class="rw" style="margin-top:8px"><input id="nt" type="text" placeholder="New task, only if not listed"><button data-a="na">Add</button></div></div>`;
 return h}
function vClose(){if(!S.cur)return NOP;
 const td=S.tasks.filter(t=>t.sc===today);
 return (td.length?td.map(t=>`<div class="cd c" id="c${t.id}"><div class="hr"><b>${esc(t.n)}</b><span class="pl" id="p${t.id}"></span></div><div class="hr" style="margin-top:6px"><span class="mu" id="s${t.id}"></span><span class="pin"><input type="number" min="0" max="100" inputmode="numeric" value="${t.p}" data-id="${t.id}" data-f="p" aria-label="Progress percent">%</span></div><textarea rows="2" placeholder="Remark for this task" data-id="${t.id}" data-f="r">${esc(t.r||'')}</textarea><div class="th" id="th${t.id}"></div></div>`).join(''):'<div class="cd em">No tasks scheduled today. Plan your day first.</div>')
 +`<div class="cd"><h3>Other points</h3><div class="ch">`+CATS.map(c=>`<button class="sm${c===CS?' on':''}" data-c="${c}">${c}</button>`).join('')+`</div><div class="rw"><input id="px" type="text" placeholder="Short note"><button data-a="pa">Add</button></div><label class="mu" style="display:block;margin:8px 0"><input type="checkbox" id="pn" style="min-height:0"> Needs action tomorrow</label><div id="pl"></div></div>`
 +`<div class="cd"><div class="hr"><span class="mu">Day progress</span><b id="tot" class="big"></b></div><div class="bar"><i id="bar"></i></div><div class="g2"><button class="pr" data-a="sub">Submit report</button><button data-a="xd">Export PDF</button></div><button data-a="xs" style="width:100%;margin-top:8px">Submit and share report file</button></div>`}
function afterClose(){S.tasks.filter(t=>t.sc===today).forEach(ph);pts();upd()}
function upd(){const td=S.tasks.filter(t=>t.sc===today);td.forEach(t=>{const s=st(t,today),p=$('p'+t.id);if(!p)return;p.className='pl '+s.c;p.textContent=s.l;$('s'+t.id).textContent='Day '+s.day+' of '+t.a+' · Expected '+s.exp+'%';$('c'+t.id).classList.toggle('late',s.k===0)});const a=avg(td);if($('tot')){$('tot').textContent=a+'%';$('bar').style.width=a+'%'}}
function ph(t){const el=$('th'+t.id);if(!el)return;const n=(t.ph||[]).length;el.innerHTML=(t.ph||[]).map((i,k)=>`<span class="pw"><img data-pid="${esc(i)}" alt="Photo ${k+1}"><button class="x" data-a="pd" data-id="${t.id}" data-k="${k}" aria-label="Remove photo">x</button></span>`).join('')+(assets?`<button class="sm" data-a="ph" data-m="fc" data-id="${t.id}">Camera</button><button class="sm" data-a="ph" data-m="fi" data-id="${t.id}">Gallery</button>`:'')+(n?'':'<span class="mu">Optional</span>');hydrate()}
function pts(){const el=$('pl');if(el)el.innerHTML=S.pts.map((p,i)=>`<div class="it${p.a?' late':''}"><div><span class="pl ab">${esc(p.c)}</span>${p.a?' <span class="pl wn">Needs action</span>':''}<div>${esc(p.t)}</div></div><button class="sm" data-a="pr" data-i="${i}" aria-label="Remove">x</button></div>`).join('')}
const pcOf=d=>{const c=d.pc||(d.pj&&d.pj.code)||'',m=PROJ.some(y=>y.code===c)?0:PROJ.find(x=>(x.prev||[]).includes(c));return m?m.code:c},fl=()=>DAYS.filter(d=>(PW==='all'||pcOf(d)===PW)&&(WHO==='all'||d.uid===WHO)&&(TW==='all'||(d.team||'No team')===TW));
function who(){const ids=[...new Set(DAYS.map(d=>d.uid))],ts=[...new Set(TEAMS.concat(DAYS.map(d=>d.team||'No team')))],ps=[...new Set(DAYS.map(pcOf).filter(Boolean))];
 return `<select id="pw" aria-label="Project" style="margin-bottom:8px"><option value="all">All projects</option>`+ps.map(x=>`<option value="${esc(x)}"${x===PW?' selected':''}>${esc(x)}</option>`).join('')+`</select><div class="g2" style="margin:0 0 10px"><select id="team" aria-label="Team"><option value="all">All teams</option>`+ts.map(x=>`<option${x===TW?' selected':''}>${esc(x)}</option>`).join('')+`</select><select id="who" aria-label="Person"><option value="all">Everyone</option>`+ids.map(i=>`<option value="${i}"${i===WHO?' selected':''}>${esc(nm(i))}</option>`).join('')+`</select></div>`}
function vHist(){HL=fl().sort((a,b)=>b.date.localeCompare(a.date));

function det(d,i){return d.tasks.map(t=>{const s=st(t,d.date);return `<div class="d1"><div class="hr"><span>${esc(t.n)} · ${t.p}%</span><span class="pl ${s.c}">${s.l}</span></div>${t.r?`<div class="mu">${esc(t.r)}</div>`:''}<div class="th">${t.ph.map(p=>`<img data-pid="${esc(p)}" alt="Task photo">`).join('')}</div></div>`}).join('')+(d.pts||[]).map(p=>`<div class="d1"><span class="pl ab">${esc(p.c)}</span>${p.a?' <span class="pl wn">Needs action</span>':''} ${esc(p.t)}</div>`).join('')+`<div class="g2"><button data-a="dpdf" data-i="${i}">PDF</button><button data-a="dcp" data-i="${i}">Copy summary</button><button data-a="dsh" data-i="${i}">Share file</button></div>`}
function W(){const m=add(today,-((D(today).getDay()+6)%7)+7*wo),e=add(m,6),L=fl().filter(d=>d.date>=m&&d.date<=e).sort((a,b)=>a.date.localeCompare(b.date)),tk={};

 return{m,e,L,V,avg:L.length?Math.round(L.reduce((a,d)=>a+d.avg,0)/L.length):0,done:V.filter(x=>x.t.p>=100).length,late:V.filter(x=>st(x.t,x.d.date).k===0).length,ph:L.reduce((a,d)=>a+d.tasks.reduce((b,t)=>b+t.ph.length,0),0),

function vWeek(){const w=W();

 +(w.teams.length?`<div class="cd"><h3>Teams</h3>`+w.teams.map(t=>`<div class="d1"><div class="hr"><b>${esc(t.n)}</b><b>${t.avg}%</b></div><div class="bar"><i style="width:${t.avg}%"></i></div><div class="mu">${t.done} of ${t.tot} tasks completed · ${t.late} delayed · ${t.rep} reports</div></div>`).join('')+`</div>`:'')+`<div class="cd"><h3>Task status</h3>`+(w.V.length?w.V.map(x=>{const s=st(x.t,x.d.date);return `<div class="it"><span>${esc(x.t.n)} <span class="mu">${x.t.p}%</span></span><span class="pl ${s.c}">${s.l}</span></div>`}).join(''):'<div class="em">No reports this week.</div>')+`</div>`

function render(){

function wText(w){return 'Weekly progress report '+fmt(w.m)+' to '+fmt(w.e)+'\n'+(new Set(w.L.map(pcOf)).size>1?'Multiple projects':w.L[0]?pj(w.L[0]):'')+'\nAverage progress '+w.avg+'% | Completed '+w.done+' of '+w.V.length+' | Delayed '+w.late+' | Photos '+w.ph+(w.teams.length?'\nTeams:\n'+w.teams.map(t=>'- '+t.n+': '+t.avg+'% | '+t.done+' of '+t.tot+' completed | '+t.late+' delayed').join('\n'):'')+'\nTasks:\n'+w.V.map(x=>'- '+x.t.n+': '+x.t.p+'% ('+st(x.t,x.d.date).l+')').join('\n')+(Object.keys(w.cats).length?'\nOther points: '+Object.entries(w.cats).map(([c,n])=>c+' '+n).join(', '):'')}

let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('fabs',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
async function pput(id,u){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(u,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function pget(id){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result||'');q.onerror=()=>res('')})}catch(e){return ''}}

async function outFile(b,n,sh){try{const f=new File([b],n,{type:b.type});if(sh&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('Saved '+n)}
