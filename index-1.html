<style>

</head><body><div class="w">
<div id="pj"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></symbol>

<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

const TEAMS=['Mechanical','Civil','Electrical','Other'];

let S=null,PROJ=[],PW='all',NP=false,DAYS=[],NAMES={},me={id:'local',name:''},db=null,assets=null,dl=null,usr=null,cur='plan',PE=false,WHO='all',TW='all',wo=0,CS='',PT='',HL=[],tm;
function st(t,at){const day=dd(at,t.s)+1,over=day-t.a,exp=day<1?0:Math.min(100,Math.round(day/t.a*100)),e0=add(t.s,t.a-1),sv=t.as?dd(t.as,t.s):0,r={day,exp,sv};
 if(t.p>=100){r.fv=t.af?dd(t.af,e0):0;return Object.assign(r,{c:'ok',l:'Done',k:3})}
 if(over>0)return Object.assign(r,{c:'no',l:'Delayed '+over+' day'+(over>1?'s':''),k:0});
 if(day<1)return Object.assign(r,{c:'ok',l:t.as&&dd(at,t.as)>=0?'Ahead of plan':'Starts in '+(1-day)+' day'+(1-day>1?'s':''),k:2});
 if(t.p<exp)return Object.assign(r,{c:'wn',l:'Behind',k:1});
 return Object.assign(r,{c:'ok',l:'On track',k:2})}
const fd=x=>D(x).toLocaleDateString(undefined,{day:'numeric',month:'short'}),pe=t=>add(t.s,t.a-1);
function planTxt(t,s){return 'Plan '+fd(t.s)+' to '+fd(pe(t))+(t.as?' · Started '+fd(t.as)+(s.sv?' ('+Math.abs(s.sv)+' d '+(s.sv>0?'late':'early')+')':''):'')+(t.ne?' · Extended to '+fd(t.ne):'')+(t.af?' · Finished '+fd(t.af)+(s.fv?' ('+Math.abs(s.fv)+' d '+(s.fv>0?'late':'early')+')':''):'')}
const avg=a=>a.length?Math.round(a.reduce((x,t)=>x+t.p,0)/a.length):0,due=t=>fmt(add(t.s,t.a-1)),nm=u=>u===me.id?(me.name||'You'):(NAMES[u]||'Teammate');
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},LW=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function save(){clearTimeout(tm);tm=setTimeout(async()=>{try{db?await db.doc('state/'+me.id).set(S):LW('st',S);sync()}catch(e){msg('Could not save. Check your connection.')}},500)}
async function putDay(d){if(db)await db.doc('days/'+d.date+'_'+d.uid+'_'+(d.pc||'').replace(/[^A-Za-z0-9_-]/g,'_')).set(d);else{DAYS=DAYS.filter(x=>x.date!==d.date||x.uid!==d.uid||x.pc!==d.pc).concat([d]);LW('days',DAYS)}}
async function names(){if(!usr)return;const ids=[...new Set(DAYS.map(d=>d.uid))];try{const p=await usr.profiles(ids);ids.forEach(i=>NAMES[i]=(p[i]&&p[i].name)||'');if(cur==='rep')render()}catch(e){}}
async function init(){
 assets=1;
 try{const q=new URLSearchParams(location.search),u=q.get('s');if(u&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){CFG={u,t:q.get('t')||''};LW('cfg',CFG);history.replaceState(null,'',location.pathname)}}catch(e){}
 me={id:LS('uid')||'u'+Math.random().toString(36).slice(2,10),name:LS('uname')||''};LW('uid',me.id);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 let s=null;if(db){try{const r=await db.doc('state/'+me.id).get();s=r.exists?r.data():null}catch(e){}}else s=LS('st');
 S=Object.assign({project:{code:'',name:'',client:''},team:'',cur:'',pr:{},sd:{},tasks:[],pts:[],pd:'',iss:[]},s||{});
 if(S.pd!==today){S.pts=[];S.pd=today;S.sd={}}
 S.pr=S.pr||{};if(!S.cur&&S.project&&S.project.code)S.cur=S.project.code;[S.tasks].concat(Object.values(S.pr).map(v=>v.tasks||[])).forEach(L=>L.forEach(t=>{if(!t.as)t.as=t.s}));PE=!S.cur||!S.team||!me.name||(!!CFG.t&&!LS('pin'));
 if(db){try{db.collection('days').onSnapshot(q=>{DAYS=q.docs.map(d=>d.data());names();if(cur==='rep')render()},()=>{})}catch(e){}}else DAYS=LS('days')||[];DAYS.forEach(d=>{if(d.name)NAMES[d.uid]=d.name});
 if(db){try{db.collection('projects').onSnapshot(q=>{PROJ=q.docs.map(d=>d.data());fixCur();if(cur!=='close'&&!($('pc')&&($('pc').value||$('pn2').value)))render()},()=>{})}catch(e){}}else PROJ=LS('projs')||[];
 if(S.project&&S.project.code&&!S.mg){S.mg=1;putProj(S.project).catch(()=>{});save()}
 
 render()}
const NOP='<div class="cd em">No project selected. Choose one above, or ask your project manager to add it.</div>',isNew=()=>NP||(!S.cur&&!PROJ.length),curP=()=>PROJ.find(x=>x.code===S.cur)||{code:S.cur,name:'',client:''};
async function delProj(c){if(CFG.u&&ADM)return;PROJ=PROJ.filter(x=>x.code!==c);LW('projs',PROJ)}
function fixCur(){if(!S)return;let ch=0;PROJ.forEach(m=>(m.prev||[]).forEach(o=>{if(o===m.code||PROJ.some(x=>x.code===o))return;if(S.pr&&S.pr[o]){S.pr[m.code]=S.pr[o];delete S.pr[o];ch=1}if(S.cur===o){S.cur=m.code;ch=1}}));if(ch)save()}
async function putProj(p){if(CFG.u&&ADM){const ex=PA.find(x=>x.code===(p.old||p.code));if(!await saveProj({code:p.code,name:p.name,client:p.client,ps:ex?ex.ps:'',pe:ex?ex.pe:'',ms:ex?ex.ms:[],active:true,old:p.old}))throw new Error('save');return}PROJ=PROJ.filter(x=>x.code!==p.code).concat([Object.assign({active:true,ms:[]},p)]);LW('projs',PROJ)}
function switchTo(c){if(c===S.cur)return;if(S.cur)S.pr[S.cur]={tasks:S.tasks,pts:S.pts,pd:S.pd,iss:S.iss,sd:S.sd};const n=S.pr[c]||{tasks:[],pts:[],pd:today,iss:[],sd:{}};S.tasks=n.tasks||[];S.pts=n.pd===today?(n.pts||[]):[];S.sd=n.pd===today?(n.sd||{}):{};S.pd=today;S.iss=n.iss||[];S.cur=c}
const ring=(p,c)=>`<svg class="rg" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="20" style="stroke:var(--bd)"/><circle cx="26" cy="26" r="20" class="${c}" stroke-linecap="round" stroke-dasharray="${(125.66*p/100).toFixed(1)} 125.66" transform="rotate(-90 26 26)"/><text x="26" y="30" text-anchor="middle">${p}%</text></svg>`;
function hero(){const td=S.tasks.filter(t=>t.sc===today),a=avg(td),pend=S.tasks.filter(t=>t.p<100),late=pend.filter(t=>st(t,today).k===0).length;
 return `<div class="hero"><div class="mu2">Today's progress</div><div class="hr"><b class="hb" id="hv">${td.length?a+'%':'-'}</b><div class="mu2" style="text-align:right">${td.length} scheduled<br>${pend.length} pending · ${late} delayed</div></div><div class="hbar"><i id="hbar" style="width:${a}%"></i></div></div>`}
const tskCard=(t,s,right,extra)=>`<div class="tc${s.k?'':' late'}">${ring(t.p,s.c)}<div class="tb"><div class="tn">${esc(t.n)}</div><div class="mu">${planTxt(t,s)}</div><span class="pl ${s.c}">${s.l}</span></div>${right?`<div class="rt">${right}</div>`:''}</div>${extra||''}`;
const edit=t=>`<div class="cd"><label class="lb">Actual start</label><input id="e1" type="date" value="${esc(t.as||'')}"><label class="lb">Extend end date to (the original plan is kept for delay tracking)</label><input id="e2" type="date" value="${esc(t.ne||'')}">${t.lk?`<div class="mu" style="margin-top:6px">Original plan: ${fd(t.s)} to ${fd(pe(t))} (locked after the first report)</div>`:`<label class="lb">Planned start</label><input id="e3" type="date" value="${t.s}"><label class="lb">Planned end</label><input id="e4" type="date" value="${pe(t)}">`}<button class="pr" data-a="ds" data-id="${t.id}" style="width:100%;margin-top:10px">Save dates</button></div>`;
const addForm=()=>`<div class="cd"><h3>Add a task</h3>`+(TPL.length?`<div class="ch">`+TPL.map((n,i)=>`<button class="sm" data-a="tp" data-i="${i}">${esc(n)}</button>`).join('')+`</div>`:'')+`<input id="nt" type="text" placeholder="Task name"><div class="g2" style="margin-top:6px"><div><label class="lb">Planned start</label><input id="nps" type="date"></div><div><label class="lb">Planned end</label><input id="npe" type="date"></div></div><label class="lb">Actual start</label><input id="nas" type="date" value="${today}"><button class="pr" data-a="na" style="width:100%;margin-top:10px">Add task</button></div>`;
function vPlan(){if(!S.cur)return NOP;

 const oi=S.iss.map((x,i)=>Object.assign({i},x)).filter(x=>x.st!=='closed');if(oi.length)h+=`<div class="cd"><h3>Open issues</h3>`+oi.map(x=>`<div class="it"><div><span class="pl ab">${esc(x.c)}</span> <span class="mu">${fmt(x.d)} · ${dd(today,x.d)} d open</span><div>${esc(x.t)}</div></div><button class="sm" data-a="res" data-i="${x.i}">Resolve</button></div>`).join('')+`</div>`;
 h+=`<div class="hr" style="margin:6px 2px"><h3 style="margin:0">Pending tasks (${pend.length})${late?' · '+late+' delayed':''}</h3>${pend.length?'<button class="sm" data-a="all">Add all</button>':''}</div>`+(pend.length?pend.map(t=>tskCard(t,st(t,today),`<button class="sm" data-a="add" data-id="${t.id}">Add</button>`)).join(''):'<div class="em" style="margin-bottom:12px">No pending tasks.</div>');

function vClose(){if(!S.cur)return NOP;
 const td=S.tasks.filter(t=>t.sc===today);
 return hero()+(td.length?td.map(t=>`<div class="cd c" id="c${t.id}"><div class="hr"><div class="hr" style="justify-content:flex-start;gap:12px"><span id="rg${t.id}"></span><div><div class="tn">${esc(t.n)}</div><div class="mu" id="s${t.id}"></div></div></div><span class="pl" id="p${t.id}"></span></div><div class="hr" style="margin-top:8px"><span class="mu">Progress</span><span class="pin"><input type="number" min="0" max="100" inputmode="numeric" value="${t.p}" data-id="${t.id}" data-f="p" aria-label="Progress percent">%</span></div><textarea rows="2" placeholder="Remark for this task" data-id="${t.id}" data-f="r">${esc(t.r||'')}</textarea><div id="dr${t.id}"></div><div class="th" id="th${t.id}"></div></div>`).join(''):'<div class="cd em">No tasks scheduled today. Plan your day first.</div>')+sdCard()

 +`<div class="cd"><h3>Other points</h3><div class="ch">`+CATS.map(c=>`<button class="sm${c===CS?' on':''}" data-c="${c}">${c}</button>`).join('')+`</div><div class="rw"><input id="px" type="text" placeholder="Short note"><button data-a="pa">Add</button></div><label class="mu" style="display:block;margin:8px 0"><input type="checkbox" id="pn" style="min-height:0"> Needs action tomorrow</label><div id="pl"></div></div>`
 +`<div class="cd"><div class="hr"><span class="mu">Day progress</span><b id="tot" class="big"></b></div><div class="bar"><i id="bar"></i></div><div class="g2"><button class="pr" data-a="sub">Submit report</button><button data-a="xd">Export PDF</button></div><button data-a="xs" style="width:100%;margin-top:8px">Submit and share report file</button></div>`}
